interface:
  display_name: "通用四视图人物定妆照设计师"
  short_description: "任意性别、年龄、时代的写实人物定妆；特写与正侧背全身同一身份"
  default_prompt: "使用 $nuyoah-portrait-character-designer，按我的人物或参考图生成完整四视图定妆照提示词：人像特写、正面全身、标准侧面全身、背面全身。保留年龄、性别、时代与身体设定，不擅自改变身份。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "auto"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    generic: "neutral-source"
