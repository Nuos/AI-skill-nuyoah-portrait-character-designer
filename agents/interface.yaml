interface:
  display_name: "南鸢·人像角色设定师"
  short_description: "把人物气质转成不同的人脸结构与妆容，默认交付可复制的中文提示词"
  default_prompt: "使用 $nuyoah-portrait-character-designer 设计一个清冷但保留圆脸和圆钝下巴的成年人物。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "auto"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    generic: "neutral-source"
