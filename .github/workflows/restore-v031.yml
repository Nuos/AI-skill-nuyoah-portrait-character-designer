name: Restore and validate v0.3.1 delivery

on:
  push:
    branches:
      - update/four-view-v0.3.1-20260927

permissions:
  contents: write

concurrency:
  group: restore-four-view-v031
  cancel-in-progress: false

jobs:
  restore:
    if: github.repository == 'Nuos/AI-skill-nuyoah-portrait-character-designer' && github.ref == 'refs/heads/update/four-view-v0.3.1-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact authorized feature-branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Restore exact delivery, run fresh tests, and commit only to feature branch
        run: python3 .github/scripts/restore-v031.py
